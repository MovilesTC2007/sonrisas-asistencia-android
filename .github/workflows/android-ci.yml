name: Android CI - Análisis Estático

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Ktlint & Detekt
    runs-on: self-hosted

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permisos al Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Ejecutar Ktlint
        run: ./gradlew ktlintCheck

      - name: Ejecutar Detekt
        run: ./gradlew detekt

      - name: Upload Detekt Report
        uses: actions/upload-artifact@v4
        if: always() # Subir el reporte como artifact
        with:
          name: detekt-report-${{ github.run_number }}
          path: app/build/reports/detekt/detekt.html
          retention-days: 1 # Tiempo de vida del reporte
